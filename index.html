<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘ゲーム</title>
<style>
body { margin:0; overflow:hidden; }
#ui { position:absolute; top:15px; left:15px; color:white; background:rgba(0,0,0,0.4); padding:10px; border-radius:10px; }
#weaponUI { position:absolute; bottom:20px; right:20px; color:white; background:rgba(0,0,0,0.5); padding:10px; border-radius:10px; }
#crosshair { position:absolute; top:50%; left:50%; width:10px; height:10px; margin:-5px; border:2px solid white; border-radius:50%; }
</style>
</head>
<body>
<div id="ui"></div>
<div id="weaponUI"></div>
<div id="crosshair"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
let scene=new THREE.Scene();
let camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
let renderer=new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// 地面
let ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshBasicMaterial({color:0x228B22}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

// ===== プレイヤー（人型＋銃） =====
let player=new THREE.Object3D(); scene.add(player);

let body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,0.5),new THREE.MeshBasicMaterial({color:0x0000ff}));
body.position.y=1;
player.add(body);

let head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),new THREE.MeshBasicMaterial({color:0xffffcc}));
head.position.y=2;
player.add(head);

let gun=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.2,0.2),new THREE.MeshBasicMaterial({color:0x333333}));
gun.position.set(0.6,1.2,0);
player.add(gun);

// ===== カメラ（右肩視点） =====
function updateCamera(){
 let offset=new THREE.Vector3(1.5,3,6);
 offset.applyQuaternion(player.quaternion);
 camera.position.copy(player.position).add(offset);
 camera.lookAt(player.position.x, player.position.y+1.5, player.position.z);
}

// ===== 敵 =====
let enemies=[];
function spawnEnemy(){
 let e=new THREE.Object3D();

 let body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,0.5),new THREE.MeshBasicMaterial({color:0xff0000}));
 body.position.y=1;
 e.add(body);

 let head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),new THREE.MeshBasicMaterial({color:0xffcccc}));
 head.position.y=2;
 e.add(head);

 e.position.set(Math.random()*40-20,0,Math.random()*40-20);
 e.userData={hp:50,cool:0};
 scene.add(e);
 enemies.push(e);
}
for(let i=0;i<6;i++) spawnEnemy();

// ===== 操作 =====
let keys={};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let yaw=0;
document.body.addEventListener('mousemove',e=>{
 yaw-=e.movementX*0.002;
 player.rotation.y=yaw;
});

// ===== 弾 =====
let bullets=[];
window.addEventListener('mousedown',()=>{
 let b=new THREE.Mesh(new THREE.SphereGeometry(0.1),new THREE.MeshBasicMaterial({color:0xffff00}));
 b.position.copy(gun.getWorldPosition(new THREE.Vector3()));
 let dir=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
 b.userData.vel=dir.multiplyScalar(0.8);
 scene.add(b); bullets.push(b);
});

// ===== 更新 =====
let hp=100,kills=0;
function update(){
 if(keys['w']) player.translateZ(-0.15);
 if(keys['s']) player.translateZ(0.15);
 if(keys['a']) player.translateX(-0.15);
 if(keys['d']) player.translateX(0.15);

 bullets.forEach((b,i)=>{
  b.position.add(b.userData.vel);
  enemies.forEach(e=>{
   if(b.position.distanceTo(e.position)<1){ e.userData.hp-=10; scene.remove(b); bullets.splice(i,1); }
  });
 });

 enemies.forEach(e=>{
  let dir=player.position.clone().sub(e.position).normalize();
  e.position.add(dir.multiplyScalar(0.03));
 });

 enemies=enemies.filter(e=>{
  if(e.userData.hp<=0){ scene.remove(e); kills++; spawnEnemy(); return false; }
  return true;
 });

 document.getElementById('ui').innerText=`HP:${hp} | キル:${kills}`;
 document.getElementById('weaponUI').innerText=`TPSモード`;
}

function animate(){ requestAnimationFrame(animate); update(); updateCamera(); renderer.render(scene,camera);} animate();
</script>
</body>
</html>
