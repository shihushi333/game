<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>簡易フォートナイト風TPS</title>
<style>
body { margin:0; overflow:hidden; background:#87ceeb; }
canvas { display:block; }
#ui { position:absolute; top:10px; left:10px; color:white; font-family:sans-serif; }
</style>
</head>
<body>
<div id="ui">WASD移動 / マウス視点 / クリック射撃</div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let keys = {};
let bullets = [];
let enemies = [];

const player = {
  x: 0,
  y: 0,
  angle: 0,
  speed: 0.15,
  hp: 100
};

// 敵生成
for(let i=0;i<5;i++){
  enemies.push({
    x: Math.random()*20-10,
    y: Math.random()*20-10,
    hp: 50
  });
}

window.addEventListener('keydown', e=>keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e=>keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousemove', e=>{
  player.angle += e.movementX * 0.002;
});

canvas.addEventListener('click', ()=>{
  bullets.push({
    x: player.x,
    y: player.y,
    dx: Math.cos(player.angle)*0.5,
    dy: Math.sin(player.angle)*0.5
  });
});

function update(){
  if(keys['w']){
    player.x += Math.cos(player.angle)*player.speed;
    player.y += Math.sin(player.angle)*player.speed;
  }
  if(keys['s']){
    player.x -= Math.cos(player.angle)*player.speed;
    player.y -= Math.sin(player.angle)*player.speed;
  }
  if(keys['a']){
    player.x += Math.cos(player.angle - Math.PI/2)*player.speed;
    player.y += Math.sin(player.angle - Math.PI/2)*player.speed;
  }
  if(keys['d']){
    player.x += Math.cos(player.angle + Math.PI/2)*player.speed;
    player.y += Math.sin(player.angle + Math.PI/2)*player.speed;
  }

  bullets.forEach((b, i)=>{
    b.x += b.dx;
    b.y += b.dy;

    enemies.forEach((e, ei)=>{
      const dx = e.x - b.x;
      const dy = e.y - b.y;
      if(Math.sqrt(dx*dx+dy*dy) < 0.5){
        e.hp -= 10;
        bullets.splice(i,1);
      }
    });
  });

  // 敵AI
  enemies.forEach(e=>{
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist > 1){
      e.x += dx/dist * 0.03;
      e.y += dy/dist * 0.03;
    } else {
      player.hp -= 0.1;
    }
  });

  enemies = enemies.filter(e=>e.hp > 0);
}

function draw(){
  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // 地面
  ctx.fillStyle = '#228B22';
  ctx.fillRect(0, canvas.height/2, canvas.width, canvas.height/2);

  // 敵描画（3人称っぽい）
  enemies.forEach(e=>{
    const dx = e.x - player.x;
