<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦闘ゲーム</title>
<style>
 body { margin:0; overflow:hidden; background:#000;}
 #ui {
  position:fixed;
  top:10px; left:10px;
  color:white; font-size:14px;
 }
</style>
</head>
<body>
<div id="ui">
WASD移動 / クリック射撃 / 右クリックエイム<br>
Q壁 E床 F階段 B建築 / 右クリック削除
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
// ===== 基本 =====
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
let renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// ===== 地面 =====
let ground = new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshBasicMaterial({color:0x228822})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// ===== プレイヤー =====
let player=new THREE.Object3D();
scene.add(player);

// 体
let body=new THREE.Mesh(
 new THREE.BoxGeometry(1,1.5,1),
 new THREE.MeshBasicMaterial({color:0x0000ff})
);
body.position.y=0.75;
player.add(body);

// 頭
let head=new THREE.Mesh(
 new THREE.BoxGeometry(0.6,0.6,0.6),
 new THREE.MeshBasicMaterial({color:0xddddff})
);
head.position.y=1.6;
player.add(head);

// 銃
let gun=new THREE.Mesh(
 new THREE.BoxGeometry(0.8,0.2,0.2),
 new THREE.MeshBasicMaterial({color:0x333333})
);
gun.position.set(0.6,1.2,-0.3);
player.add(gun);

// ===== 敵 =====
let enemies=[];
function spawnEnemy(){
 let e=new THREE.Object3D();

 let body=new THREE.Mesh(
  new THREE.BoxGeometry(1,1.5,1),
  new THREE.MeshBasicMaterial({color:0xff0000})
 );
 body.position.y=0.75;
 e.add(body);

 e.position.set(Math.random()*20-10,0,Math.random()*20-10);
 scene.add(e);
 enemies.push(e);
}
for(let i=0;i<5;i++) spawnEnemy();

// ===== 弾 =====
let bullets=[];

// ===== 建築 =====
let builds=[];
let buildType='wall';
let preview;

function createPreview(){
 if(preview) scene.remove(preview);
 let geo;
 if(buildType==='wall') geo=new THREE.BoxGeometry(2,2,0.3);
 if(buildType==='floor') geo=new THREE.BoxGeometry(2,0.3,2);
 if(buildType==='ramp') geo=new THREE.BoxGeometry(2,0.3,2);

 preview=new THREE.Mesh(
  geo,
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.3})
 );
 scene.add(preview);
}
createPreview();

function build(){
 let geo;
 if(buildType==='wall') geo=new THREE.BoxGeometry(2,2,0.3);
 if(buildType==='floor') geo=new THREE.BoxGeometry(2,0.3,2);
 if(buildType==='ramp') geo=new THREE.BoxGeometry(2,0.3,2);

 let obj=new THREE.Mesh(
  geo,
  new THREE.MeshBasicMaterial({color:0x888888})
 );

 if(buildType==='ramp') obj.rotation.x=-Math.PI/4;

 let dir=new THREE.Vector3(0,0,-3).applyQuaternion(player.quaternion);
 obj.position.set(player.position.x+dir.x,1,player.position.z+dir.z);

 scene.add(obj);
 builds.push(obj);
}

// ===== 操作 =====
let keys={};
let isAiming=false;

window.addEventListener('keydown',e=>{
 keys[e.key]=true;

 if(e.key==='q'){ buildType='wall'; createPreview();}
 if(e.key==='e'){ buildType='floor'; createPreview();}
 if(e.key==='f'){ buildType='ramp'; createPreview();}
 if(e.key==='b') build();
});

window.addEventListener('keyup',e=> keys[e.key]=false);

// マウス
window.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('mousedown',e=>{
 if(e.button===0){ // 射撃
  let bullet=new THREE.Mesh(
   new THREE.SphereGeometry(0.2),
   new THREE.MeshBasicMaterial({color:0xffff00})
  );
  bullet.position.copy(player.position);
  bullet.velocity=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion).multiplyScalar(1);
  scene.add(bullet);
  bullets.push(bullet);
 }

 if(e.button===2){ // エイム or 削除
  isAiming=true;

  builds.forEach((obj,i)=>{
   if(obj.position.distanceTo(player.position)<3){
    scene.remove(obj);
    builds.splice(i,1);
   }
  });
 }
});

window.addEventListener('mouseup',e=>{
 if(e.button===2) isAiming=false;
});

// ===== 更新 =====
function update(){

 // 移動
 if(keys['w']) player.position.z-=0.2;
 if(keys['s']) player.position.z+=0.2;
 if(keys['a']) player.position.x-=0.2;
 if(keys['d']) player.position.x+=0.2;

 // カメラ（TPS + エイム）
 let offset = isAiming
  ? new THREE.Vector3(1,2,3)
  : new THREE.Vector3(3,3,6);

 let camPos=offset.clone().applyQuaternion(player.quaternion);

 camera.position.set(
  player.position.x+camPos.x,
  player.position.y+camPos.y,
  player.position.z+camPos.z
 );

 camera.lookAt(player.position.x,player.position.y+1.5,player.position.z);

 // プレビュー
 if(preview){
  let dir=new THREE.Vector3(0,0,-3).applyQuaternion(player.quaternion);
  preview.position.set(player.position.x+dir.x,1,player.position.z+dir.z);
 }

 // 弾
 bullets.forEach((b,i)=>{
  b.position.add(b.velocity);

  enemies.forEach((e,j)=>{
   if(b.position.distanceTo(e.position)<1){
    scene.remove(e);
    enemies.splice(j,1);
   }
  });
 });

 // 敵AI
 enemies.forEach(e=>{
  let dir=new THREE.Vector3().subVectors(player.position,e.position).normalize();
  e.position.add(dir.multiplyScalar(0.02));
 });
}

// ===== ループ =====
function animate(){
 requestAnimationFrame(animate);
 update();
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
