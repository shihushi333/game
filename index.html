<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>簡易FPSゲーム</title>
<style>
body { margin:0; overflow:hidden; background:#000; color:#fff; font-family:sans-serif; }
#info { position:absolute; top:10px; left:10px; }
canvas { display:block; }
</style>
</head>
<body>
<div id="info">WASD:移動 / マウス:視点 / クリック:射撃</div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let keys = {};
let bullets = [];

const player = {
  x: 0,
  y: 0,
  angle: 0,
  speed: 0.1
};

const enemy = {
  x: 5,
  y: 5,
  hp: 5
};

window.addEventListener('keydown', e=>keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e=>keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousemove', e=>{
  player.angle += e.movementX * 0.002;
});

canvas.addEventListener('click', ()=>{
  bullets.push({
    x: player.x,
    y: player.y,
    dx: Math.cos(player.angle)*0.5,
    dy: Math.sin(player.angle)*0.5
  });
});

function update(){
  if(keys['w']){
    player.x += Math.cos(player.angle)*player.speed;
    player.y += Math.sin(player.angle)*player.speed;
  }
  if(keys['s']){
    player.x -= Math.cos(player.angle)*player.speed;
    player.y -= Math.sin(player.angle)*player.speed;
  }
  if(keys['a']){
    player.x += Math.cos(player.angle - Math.PI/2)*player.speed;
    player.y += Math.sin(player.angle - Math.PI/2)*player.speed;
  }
  if(keys['d']){
    player.x += Math.cos(player.angle + Math.PI/2)*player.speed;
    player.y += Math.sin(player.angle + Math.PI/2)*player.speed;
  }

  const dx = player.x - enemy.x;
  const dy = player.y - enemy.y;
  const dist = Math.sqrt(dx*dx + dy*dy);

    enemy.x += dx/dist * 0.02;
    enemy.y += dy/dist * 0.02;
  }
