<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>フォートナイト風3Dゲーム 完成版</title>
<style>
body { margin:0; overflow:hidden; }
#ui { position:absolute; top:10px; left:10px; color:white; font-family:sans-serif; }
</style>
</head>
<body>
<div id="ui"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 地面
let ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshBasicMaterial({color:0x228B22})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// プレイヤー
let player = new THREE.Object3D();
scene.add(player);
camera.position.set(0,2,5);
player.add(camera);

let velocityY = 0, onGround=true, hp=100, kills=0;

// 武器
let weaponType = 1; //1:AR 2:Shotgun
let ammo = 30;

// 敵（コンピュータ）
let enemies=[];
function spawnEnemy(){
  let e=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0xff0000}));
  e.position.set(Math.random()*20-10,0.5,Math.random()*20-10);
  e.userData.hp=50;
  scene.add(e);
  enemies.push(e);
}
for(let i=0;i<5;i++) spawnEnemy();

// 入力
let keys={};
window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===' ') jump();
  if(e.key.toLowerCase()==='b') buildWall();
  if(e.key==='1') weaponType=1;
  if(e.key==='2') weaponType=2;
});
window.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

// 視点
let yaw=0;
document.body.addEventListener('mousemove', e=>{
  yaw-=e.movementX*0.002;
  player.rotation.y=yaw;
});

function jump(){ if(onGround){ velocityY=0.25; onGround=false; }}

// 建築（壁）
function buildWall(){
  let wall = new THREE.Mesh(
    new THREE.BoxGeometry(2,2,0.5),
    new THREE.MeshBasicMaterial({color:0x888888})
  );
  let dir = new THREE.Vector3(0,0,-3).applyQuaternion(player.quaternion);
  wall.position.copy(player.position.clone().add(dir));
  wall.position.y=1;
  scene.add(wall);
}

// 弾
let bullets=[];
let canShoot=true;

window.addEventListener('mousedown', ()=>{
  if(!canShoot || ammo<=0) return;
  canShoot=false;
  ammo--;

  let spread = weaponType===2 ? 5 : 1;

  for(let i=0;i<spread;i++){
    let bullet = new THREE.Mesh(
      new THREE.SphereGeometry(0.1),
      new THREE.MeshBasicMaterial({color:0xffff00})
    );

    bullet.position.copy(camera.getWorldPosition(new THREE.Vector3()));

    let dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    dir.x += (Math.random()-0.5)*0.1;
    dir.y += (Math.random()-0.5)*0.1;
    dir.z += (Math.random()-0.5)*0.1;

    bullet.userData.vel = dir.multiplyScalar(0.7);
    scene.add(bullet);
    bullets.push(bullet);
  }

  setTimeout(()=>canShoot=true, weaponType===1?200:600);
});

function update(){
  let speed=0.1;
  if(keys['w']) player.translateZ(-speed);
  if(keys['s']) player.translateZ(speed);
  if(keys['a']) player.translateX(-speed);
  if(keys['d']) player.translateX(speed);

  // 重力
  velocityY-=0.01;
  player.position.y+=velocityY;
  if(player.position.y<=0){ player.position.y=0; velocityY=0; onGround=true; }

  // 弾
  bullets.forEach((b,i)=>{
    b.position.add(b.userData.vel);
    enemies.forEach(e=>{
      if(b.position.distanceTo(e.position)<0.7){
        e.userData.hp-=10;
        scene.remove(b);
        bullets.splice(i,1);
      }
    });
  });

  // 敵AI（攻撃あり）
  enemies.forEach(e=>{
    let dir = player.position.clone().sub(e.position).normalize();
    e.position.add(dir.multiplyScalar(0.03));

    if(e.position.distanceTo(player.position)<2){
      hp-=0.2;
    }
  });

  enemies = enemies.filter(e=>{
    if(e.userData.hp<=0){
      scene.remove(e);
      kills++;
      spawnEnemy();
      return false;
    }
    return true;
  });

  document.getElementById('ui').innerText =
    `HP:${Math.floor(hp)} | キル:${kills} | 弾:${ammo} | 武器:${weaponType===1?'AR':'SG'}`;
}

function animate(){
  requestAnimationFrame(animate);
  update();
  renderer.render(scene,camera);
}

animate();
</script>
</body>
</html>
